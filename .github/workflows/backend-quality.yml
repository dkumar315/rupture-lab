name: Backend Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: rupturelab
          POSTGRES_PASSWORD: rupturelab
          POSTGRES_DB: rupturelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rupturelab -d rupturelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUPTURELAB_DATABASE_URL: postgresql+asyncpg://rupturelab:rupturelab@127.0.0.1:5432/rupturelab

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src tests

      - name: Test with full coverage
        run: >
          python -m pytest
          --cov=rupturelab
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
