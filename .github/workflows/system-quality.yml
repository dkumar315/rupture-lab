name: System Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compose-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure ephemeral stack credentials
        run: |
          password="$(openssl rand -hex 24)"
          printf 'RUPTURELAB_DB_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf 'RUPTURELAB_DATABASE_URL=postgresql+asyncpg://rupturelab:%s@postgres:5432/rupturelab\n' "$password" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build --pull

      - name: Start RuptureLab stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Run system smoke checks
        run: ./scripts/system-smoke.sh

      - name: Run browser system test
        working-directory: frontend
        run: npm run test:system
        env:
          RUPTURELAB_SYSTEM_BASE_URL: http://127.0.0.1:3000

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps

      - name: Stop RuptureLab stack
        if: always()
        run: docker compose down -v --remove-orphans
