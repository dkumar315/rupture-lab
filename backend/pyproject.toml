[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "rupturelab-api"
version = "0.1.0"
description = "Backend service for the RuptureLab API resilience testing workbench."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "httpx2>=2.12,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "alembic>=1.19.2,<2.0",
    "asyncpg>=0.31,<1.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0",
    "uvicorn[standard]>=0.52.4,<1.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.1,<1.0",
    "mypy>=2.3.1,<3.0",
    "pip-audit>=2.10.1,<3.0",
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16.6,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py314"
required-version = ">=0.16.6,<0.17"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["rupturelab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
python_version = "3.14"
mypy_path = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
