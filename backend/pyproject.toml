[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rupturelab-api"
version = "0.1.0"
description = "Backend service for the RuptureLab API resilience testing workbench."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx2>=2.0,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["rupturelab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
