name: rupturelab

x-backend-service: &backend-service
  build:
    context: ./backend
  image: rupturelab-backend:local
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - rupturelab

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: rupturelab
      POSTGRES_PASSWORD: ${RUPTURELAB_DB_PASSWORD}
      POSTGRES_DB: rupturelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rupturelab -d rupturelab"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - rupturelab

  demo-target:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - rupturelab.demo_target.main:app
      - --host
      - 0.0.0.0
      - --port
      - "9000"
      - --no-server-header
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9000/demo/health', timeout=2).read()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  fault-proxy:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - rupturelab.proxy.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-server-header
    environment:
      RUPTURELAB_ENVIRONMENT: production
      RUPTURELAB_TARGET_URL: http://demo-target:9000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      demo-target:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/_rupturelab/health', timeout=2).read()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  api:
    <<: *backend-service
    command:
      - sh
      - -c
      - >-
        python -m alembic upgrade head &&
        exec python -m uvicorn rupturelab.main:app
        --host 0.0.0.0 --port 8000 --no-server-header
    environment:
      RUPTURELAB_ENVIRONMENT: production
      RUPTURELAB_PROXY_URL: http://fault-proxy:8080
      RUPTURELAB_DATABASE_URL: ${RUPTURELAB_DATABASE_URL}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fault-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    image: rupturelab-frontend:local
    init: true
    restart: unless-stopped
    environment:
      RUPTURELAB_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - rupturelab

volumes:
  postgres-data:

networks:
  rupturelab:
    driver: bridge
